name: ci

on:
  push:
    branches: [main]
  pull_request:

# The game targets Arch/CachyOS (see the README disclaimer), so the build and
# the self-test run in an Arch container. The headless self-test renders with
# Mesa's software rasteriser, so no GPU is required.
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git curl python sdl2 mesa libglvnd zlib

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install V 0.5.2
        run: |
          git clone --depth 1 --branch 0.5.2 https://github.com/vlang/v /opt/v
          make -C /opt/v
          ln -sf /opt/v/v /usr/local/bin/v
          v version

      - name: Build
        run: ./build.sh

      - name: Headless self-test
        run: |
          set -o pipefail
          EGL_PLATFORM=surfaceless VHEADLESS=1 VTEST=1 VSHOT=/tmp/selftest.png \
            ./build/vcraft | tee /tmp/selftest.log
          grep -q "SELFTEST PASS" /tmp/selftest.log

      - name: AppImage package
        run: ./package.sh
