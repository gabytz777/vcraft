name: setup-v
description: Build the V compiler this project needs, at a pinned commit

# Why build V instead of downloading a release zip: the published 0.5.2
# binaries predate V's support for this project's `src/` layout and refuse
# to compile it ("the virtual `src/` module directory is no longer
# supported"). The development machine runs a post-0.5.2 master build, so
# CI has to match that.
#
# Why the commits are pinned rather than the 0.5.2 tag: `make` bootstraps
# through vlang/vc, V's compiler translated to C, and clones the TIP of
# that repository by default. vc moves daily, and only the vc of the same
# era can parse a given vlib: a month after pinning, the then-current tip
# stopped accepting this V commit's own sources with
#
#   vlib/v/types/checker.v:17282: error: cannot use `&map[string]int` as
#   `&map[string]i64` in argument 4 to ...
#
# So BOTH commits are pinned: the V commit, and the vc commit that was
# current when it was verified (the compiler pair that CI built with on
# 2026-10-10). `make local=1` makes `make` use the checked-out vc as-is
# instead of pulling its tip again (it also skips fetching the bundled
# tcc, which is only a build accelerator; the system cc builds everything
# fine).
#
# Bump the pair deliberately, after checking a local build still passes:
# the vc commit to move to is the newest one older than the V commit, from
# https://github.com/vlang/vc/commits (its messages name the V commit it
# was generated from).
runs:
  using: composite
  steps:
    - name: Clone V
      shell: bash
      run: |
        git clone https://github.com/vlang/v /opt/v
        git -C /opt/v checkout 03e12f368ad5061756d523891e12cd759053f486

    - name: Pin the bootstrap compiler (vc)
      shell: bash
      run: |
        # vc stores a ~10MB C snapshot of V in every commit, so a full clone
        # is gigabytes; fetch only the pinned commit instead.
        git init /opt/v/vc
        git -C /opt/v/vc remote add origin https://github.com/vlang/vc
        git -C /opt/v/vc fetch --depth 1 origin 98961dd97f8f81e4679266919bc1d6e14b041975
        git -C /opt/v/vc checkout FETCH_HEAD

    # V's post-build step registers a GitHub problem matcher pointing at
    # /opt/v, outside the workspace. The runner rejects an add-matcher path
    # it cannot resolve and fails the step, even though V built fine.
    # Unsetting GITHUB_JOB makes that step exit immediately; the matcher only
    # prettifies V compiler annotations, and this job reports through the
    # self-test gate instead.
    - name: Build V
      shell: bash
      run: env -u GITHUB_JOB make -C /opt/v local=1

    - name: Put V on PATH
      shell: bash
      run: |
        ln -sf /opt/v/v /usr/local/bin/v
        v version
